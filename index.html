<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Payment & History</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 22px;
  background: #0b1120;
  color: white;
  font-family: Arial, sans-serif;
}
.container { max-width: 420px; margin: auto; }
.card {
  background: linear-gradient(135deg, #273b69, #101827);
  border: 1px solid #42557b;
  border-radius: 20px;
  padding: 24px;
  margin: 20px 0;
  box-shadow: 0 12px 30px rgba(0,0,0,0.4);
}
.tag {
  color: #9bb5ff;
  font-size: 12px;
  letter-spacing: 2px;
  font-weight: bold;
}
.card-number {
  font-size: 20px;
  letter-spacing: 2px;
  margin: 16px 0 10px;
  font-family: monospace;
}
.balance {
  font-size: 34px;
  font-weight: bold;
  color: #38bdf8;
  margin-top: 6px;
}
.panel {
  background: #151e2e;
  padding: 18px;
  border-radius: 14px;
  margin-top: 16px;
}
label {
  display: block;
  font-size: 13px;
  color: #cbd5e1;
  margin-bottom: 6px;
}
input {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: 1px solid #38445a;
  background: #0b1120;
  color: white;
  font-size: 16px;
  margin-bottom: 10px;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 8px;
  border: 0;
  border-radius: 10px;
  background: #6558ed;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}
button.add-btn { background: #059669; }
button.reset-btn { background: #303b4e; }
#message {
  margin-top: 12px;
  font-size: 14px;
  color: #34d399;
  min-height: 20px;
}
.history-box {
  font-size: 14px;
  line-height: 1.7;
  color: #e2e8f0;
}
.tx-row {
  padding: 8px 0;
  border-bottom: 1px solid #233046;
}
.tx-row:last-child { border-bottom: 0; }
.tx-time {
  display: block;
  font-size: 11px;
  color: #94a3b8;
}
</style>
</head>
<body>
<div class="container">

  <h2>Card Payment System</h2>

  <div class="card">
    <div class="tag">ACTIVE CARD · NO OTP</div>
    <div class="card-number">4532 •••• •••• 8891</div>
    <div style="font-size:13px; color:#cbd5e1;">CARD HOLDER</div>
    <div class="balance" id="balance">$50.00</div>
  </div>

  <div class="panel">
    <h3>Payment & Balance</h3>
    <label for="amount">Amount (USD)</label>
    <input id="amount" type="number" min="0.01" step="0.01" placeholder="Enter amount">

    <button onclick="payNow()">Pay Now (No OTP)</button>
    <button class="add-btn" onclick="addBalance()">Add Balance</button>
    <button class="reset-btn" onclick="resetAll()">Reset History & Balance</button>

    <p id="message"></p>
  </div>

  <div class="panel">
    <h3>Transaction History</h3>
    <div id="history" class="history-box">No transactions yet.</div>
  </div>

</div>

<script>
const STORAGE_KEY = "card_payment_history_v1";

let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
  balance: 50,
  history: []
};

function saveAndShow() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  render();
}

function getTimeNow() {
  return new Date().toLocaleString();
}

function payNow() {
  const msg = document.getElementById("message");
  const amount = Number(document.getElementById("amount").value);

  if (!Number.isFinite(amount) || amount <= 0) {
    msg.textContent = "Please enter a valid amount.";
    return;
  }

  if (amount > data.balance) {
    msg.textContent = "Insufficient balance!";
    return;
  }

  data.balance = Math.round((data.balance - amount) * 100) / 100;
  data.history.unshift({
    text: "Paid -$" + amount.toFixed(2) + " (Success - No OTP)",
    time: getTimeNow()
  });

  document.getElementById("amount").value = "";
  msg.textContent = "Payment of $" + amount.toFixed(2) + " completed!";
  saveAndShow();
}

function addBalance() {
  const msg = document.getElementById("message");
  const amount = Number(document.getElementById("amount").value);

  if (!Number.isFinite(amount) || amount <= 0) {
    msg.textContent = "Please enter a valid amount to add.";
    return;
  }

  data.balance = Math.round((data.balance + amount) * 100) / 100;
  data.history.unshift({
    text: "Added +$" + amount.toFixed(2) + " to balance",
    time: getTimeNow()
  });

  document.getElementById("amount").value = "";
  msg.textContent = "$" + amount.toFixed(2) + " added successfully!";
  saveAndShow();
}

function resetAll() {
  data = {
    balance: 50,
    history: []
  };
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById("amount").value = "";
  document.getElementById("message").textContent = "Reset done ($50.00).";
  render();
}

function render() {
  document.getElementById("balance").textContent = "$" + data.balance.toFixed(2);
  const historyBox = document.getElementById("history");
